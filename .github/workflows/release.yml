name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate stable release tag
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
          test "${PACKAGE_VERSION#*-}" = "${PACKAGE_VERSION}"

  mac:
    needs: test
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No Developer ID. afterSign.js does the deep ad-hoc re-sign that keeps
      # Gatekeeper on the ordinary "unidentified developer" path, and
      # UPDATE_ENABLED stays unset because Squirrel.Mac refuses to swap an app
      # it cannot verify a Developer ID signature for.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and publish macOS release
        run: npx electron-builder --config scripts/release-config.js --mac dmg zip --arm64 --x64 --publish always

  windows:
    needs: test
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Unsigned NSIS builds still auto-update; only SmartScreen changes.
      UPDATE_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and publish Windows release
        run: npx electron-builder --config scripts/release-config.js --win --x64 --publish always

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # No checkout here, so gh cannot infer the repository from a git remote.
      - name: Publish complete release
        run: gh release edit "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --draft=false --latest
